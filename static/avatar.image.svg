<?xml version="1.0" encoding="UTF-8"?>
<svg
    version="1.1"
    role="img"
    aria-labelledby="avatar-title avatar-desc"
    width="512"
    height="512"
    viewBox="0 0 65536 65536"
    color-interpolation="sRGB"
    xmlns="http://www.w3.org/2000/svg"
>
    <title id="avatar-title">Coelacanthus' Avatar</title>
    <desc id="avatar-desc">Coelacanthus' avatar made with love and magic!</desc>
    <!-- SPDX-FileCopyrightText: 2019 Coelacanthus -->
    <!-- SPDX-License-Identifier: LicenseRef-AllRightsReserved -->
    <g id="artwork">
        <g id="border">
            <rect id="outer-border"
                x="2944"
                y="4864"
                width="59648"
                height="55808"
                fill="#f45b8d"
            />
            <rect id="inner-border"
                x="8960"
                y="10880"
                width="47616"
                height="43520"
                fill="white"
            />
        </g>

        <!-- ">" shape calculation:
            Thickness t = 4480 (equal to horizontal line)
            Cap and outer-corner radius r = t/2 = 2240

            Rotate an axis-aligned L by 45° about inner vertex V = (25348, 32640).
            Constraint: lowest point at y = 44416 (aligned with cursor)
            Branch extent = (44416 - 32640 - r)√2 - r ≈ 11245.940531
        -->
        <g id="squinting-smile-terminal">
            <path id="prompt"
                d="
                    M 2240,-4480
                    L -11245.940531,-4480
                    A 2240 2240 0 0 0 -11245.940531,0
                    L 0,0
                    L 0,11245.940531
                    A 2240 2240 0 0 0 4480,11245.940531
                    L 4480,-2240
                    A 2240 2240 0 0 0 2240,-4480
                    Z
                "
                transform="translate(25348 32640) rotate(45)"
                fill="black"
            />
            <path id="cursor"
                d="
                    M 32512,39936
                    L 45312,39936
                    A 640 640 0 0 1 45312,44416
                    L 32512,44416
                    A 640 640 0 0 1 32512,39936
                    Z
                "
                fill="black"
            />
        </g>
    </g>
</svg>
