<?xml version="1.0" encoding="UTF-8"?>
<svg
    version="1.2"
    baseProfile="tiny-ps"
    role="img"
    width="512"
    height="512"
    viewBox="0 0 65536 65536"
    xmlns="http://www.w3.org/2000/svg"
>
    <title id="avatar-title">Coelacanthus' Avatar</title>
    <desc id="avatar-desc">Coelacanthus' avatar made with love and magic!</desc>
    <!-- SPDX-FileCopyrightText: 2019 Coelacanthus -->
    <!-- SPDX-License-Identifier: LicenseRef-AllRightsReserved -->
    <!-- PWA maskable / Android adaptive icon: artwork at 80% of canvas, Can be used for any launcher crop shape.  See also https://www.w3.org/TR/appmanifest/#icon-masks-->
    <g id="artwork" transform="translate(32768 32768) scale(0.8, 0.8) translate(-32768 -32768)">
        <g id="border">
            <rect id="outer-border"
                x="2944"
                y="4864"
                width="59648"
                height="55808"
                fill="#f45b8d"
            />
            <rect id="inner-border"
                x="8960"
                y="10880"
                width="47616"
                height="43520"
                fill="white"
            />
        </g>

        <!-- ">" shape calculation:
            Thickness t = 4480 (equal to horizontal line)
            Cap and outer-corner radius r = t/2 = 2240

            Opposite rotations turn translate(r -r) into a horizontal offset,
            keeping the inner vertex at (25348, 32640).
            Lowest point: 42176 + r = 44416 (aligned with cursor)
        -->
        <g id="squinting-smile-terminal">
            <path id="prompt"
                d="
                    M 15812,23104
                    L 25348,32640
                    L 15812,42176
                "
                transform="rotate(45) translate(2240 -2240) rotate(-45)"
                fill="none"
                stroke="black"
                stroke-width="4480"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
            <path id="cursor"
                d="
                    M 32512,42176
                    L 45312,42176
                "
                fill="none"
                stroke="black"
                stroke-width="4480"
                stroke-linecap="round"
            />
        </g>
    </g>
</svg>
<!-- vim: set ts=4 sts=4 sw=4 et: -->
