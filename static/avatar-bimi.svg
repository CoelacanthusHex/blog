<?xml version="1.0" encoding="UTF-8"?>
<svg
    version="1.2"
    baseProfile="tiny-ps"
    role="img"
    width="512"
    height="512"
    viewBox="0 0 16384 16384"
    xmlns="http://www.w3.org/2000/svg"
>
    <title id="avatar-title">Coelacanthus' Avatar</title>
    <desc id="avatar-desc">Coelacanthus' avatar made with love and magic!</desc>
    <!-- SPDX-FileCopyrightText: 2019 Coelacanthus -->
    <!-- SPDX-License-Identifier: LicenseRef-AllRightsReserved -->
    <!-- PWA maskable / Android adaptive icon: artwork at 80% of canvas, Can be used for any launcher crop shape.  See also https://www.w3.org/TR/appmanifest/#icon-masks-->
    <g id="artwork" transform="translate(8192 8192) scale(0.8, 0.8) translate(-8192 -8192)">
        <g id="border">
            <rect id="outer-border"
                x="736"
                y="1216"
                width="14912"
                height="13952"
                fill="#f45b8d"
            />
            <rect id="inner-border"
                x="2240"
                y="2720"
                width="11904"
                height="10880"
                fill="white"
            />
        </g>

        <!-- ">" shape calculation:
            Thickness t = 1120 (equal to horizontal line)
            Cap and outer-corner radius r = t/2 = 560

            Opposite rotations turn translate(r -r) into a horizontal offset,
            keeping the inner vertex at (6337, 8160).
            Lowest point: 10544 + r = 11104 (aligned with cursor)
        -->
        <g id="squinting-smile-terminal">
            <path id="prompt"
                d="
                    M 3953,5776
                    L 6337,8160
                    L 3953,10544
                "
                transform="rotate(45) translate(560 -560) rotate(-45)"
                fill="none"
                stroke="black"
                stroke-width="1120"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
            <path id="cursor"
                d="
                    M 8128,10544
                    L 11328,10544
                "
                fill="none"
                stroke="black"
                stroke-width="1120"
                stroke-linecap="round"
            />
        </g>
    </g>
</svg>
<!-- vim: set ts=4 sts=4 sw=4 et: -->
