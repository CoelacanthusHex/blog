        <!-- ">" shape calculation:
            Thickness t = 1120 (equal to horizontal line)
            Cap and outer-corner radius r = t/2 = 560

            Opposite rotations turn translate(r -r) into a horizontal offset,
            keeping the inner vertex at (6337, 8160).
            Lowest point: 10544 + r = 11104 (aligned with cursor)
        -->
        <g id="squinting-smile-terminal">
            <path id="prompt"
                d="
                    M 3953,5776
                    L 6337,8160
                    L 3953,10544
                "
                transform="rotate(45) translate(560 -560) rotate(-45)"
                fill="none"
                stroke="black"
                stroke-width="1120"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
            <path id="cursor"
                d="
                    M 8128,10544
                    L 11328,10544
                "
                fill="none"
                stroke="black"
                stroke-width="1120"
                stroke-linecap="round"
